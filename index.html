<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Tessela — estilos prontos para o QGIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17211C; --ink-soft:#5C6B62;
    --contour:#2F6B4F; --contour-dark:#234F3B;
    --brass:#B8853A; --line:#E5E4DF; --paper-dim:#F7F7F5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:#fff;color:var(--ink);font-family:'Inter',sans-serif;}
  h1,h2,h3{font-family:'Roboto Slab',serif;font-weight:700;margin:0;letter-spacing:-0.01em;}
  p{margin:0;}
  a{color:inherit;}

  header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 40px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:30px;height:30px;border-radius:6px;background:
    linear-gradient(135deg, var(--contour) 50%, var(--brass) 50%);
    position:relative;overflow:hidden;}
  .brand .mark::after{content:"";position:absolute;inset:0;background:
    linear-gradient(to top, var(--ink) 50%, transparent 50%);opacity:.85;}
  .brand-text{line-height:1.2;}
  .brand-text .word{font-family:'Roboto Slab',serif;font-weight:700;font-size:19px;}
  .brand-text .tag{font-size:12px;color:var(--ink-soft);}

  .search-wrap{flex:1;min-width:220px;max-width:420px;}
  #search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:8px;
    background:var(--paper-dim);font-size:14px;color:var(--ink);font-family:'Inter',sans-serif;}
  #search:focus{outline:none;border-color:var(--contour);background:#fff;}

  .filters{display:flex;gap:8px;flex-wrap:wrap;padding:0 40px 8px;}
  .chip{border:1px solid var(--line);background:var(--paper-dim);color:var(--ink-soft);
    border-radius:14px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;
    font-family:'Inter',sans-serif;transition:.15s;}
  .chip:hover{border-color:var(--contour);}
  .chip.active{background:var(--contour);color:#fff;border-color:var(--contour);}

  main{padding:32px 40px 60px;}
  #status{color:var(--ink-soft);font-size:13px;margin-bottom:18px;min-height:16px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));gap:20px;}
  .card{border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;
    background:#fff;transition:border-color .15s, transform .15s;}
  .card:hover{border-color:var(--contour);transform:translateY(-2px);}
  .card .thumb{aspect-ratio:16/10;background:
    linear-gradient(var(--line) 1px, transparent 1px) 0 0/16px 16px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/16px 16px, var(--paper-dim);
    background-size:16px 16px;overflow:hidden;}
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .card .info{padding:14px 16px 16px;}
  .card .cat{font-size:11px;font-weight:600;color:var(--contour);text-transform:uppercase;letter-spacing:.02em;margin-bottom:4px;min-height:14px;}
  .card h3{font-size:15px;font-weight:600;font-family:'Inter',sans-serif;margin-bottom:4px;}
  .card .price{font-size:14px;font-weight:700;color:var(--brass);}
  .card .price.free{color:var(--contour);}

  .empty{color:var(--ink-soft);font-size:14px;padding:40px 0;text-align:center;}

  /* overlay de detalhe */
  .overlay{position:fixed;inset:0;background:rgba(23,33,28,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:24px;}
  .overlay.show{display:flex;}
  .detail{background:#fff;border-radius:16px;max-width:920px;width:100%;max-height:90vh;overflow-y:auto;position:relative;}
  .detail .close{position:absolute;top:16px;right:16px;background:#fff;border:1px solid var(--line);
    width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--ink-soft);z-index:2;}
  .detail .close:hover{color:var(--ink);border-color:var(--ink);}

  .detail-image{aspect-ratio:16/8;background:
    linear-gradient(var(--line) 1px, transparent 1px) 0 0/20px 20px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/20px 20px, var(--paper-dim);
    background-size:20px 20px;border-radius:16px 16px 0 0;overflow:hidden;
    cursor:grab;touch-action:none;position:relative;}
  .detail-image.dragging{cursor:grabbing;}
  .detail-image img{width:100%;height:100%;object-fit:cover;display:block;
    transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-drag:none;}

  .detail-body{padding:26px 32px 32px;}
  .detail .cat{font-size:12px;font-weight:600;color:var(--contour);text-transform:uppercase;letter-spacing:.02em;margin-bottom:6px;}
  .detail h2{font-size:24px;margin-bottom:8px;}
  .detail .meta-row{display:flex;align-items:baseline;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
  .detail .price{font-size:18px;font-weight:700;color:var(--brass);}
  .detail .price.free{color:var(--contour);}
  .detail .date{font-size:12px;color:var(--ink-soft);}

  .layers-summary{font-size:13px;font-weight:600;margin-bottom:12px;}
  .layer-row{margin-bottom:16px;}
  .layer-row .name{font-size:13px;display:flex;align-items:center;gap:6px;margin-bottom:5px;}
  .icon-sym{width:12px;height:12px;border-radius:50%;background:var(--contour);display:inline-block;flex:none;}
  .icon-lbl{width:12px;height:12px;border-radius:3px;background:var(--brass);display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .icon-lbl svg{width:8px;height:8px;}
  .colorbar{display:flex;height:12px;border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,.04);}
  .colorbar span{flex:1;}

  .buy-btn{width:100%;margin-top:8px;padding:13px;border:none;border-radius:10px;background:var(--contour);
    color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .buy-btn:hover{background:var(--contour-dark);}
  .buy-btn:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed;}
  .buy-status{font-size:12px;color:var(--ink-soft);margin-top:8px;text-align:center;min-height:14px;}

  footer{padding:20px 40px;border-top:1px solid var(--line);color:var(--ink-soft);font-size:12px;}

  @media (max-width:640px){
    header,main,footer{padding-left:20px;padding-right:20px;}
    .detail-body{padding:20px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark"></div>
    <div class="brand-text">
      <div class="word">Tessela</div>
      <div class="tag">Estilos prontos para o QGIS</div>
    </div>
  </div>
  <div class="search-wrap">
    <input id="search" type="text" placeholder="Buscar por nome ou categoria">
  </div>
</header>

<div class="filters" id="filters"></div>

<main>
  <div id="status">Carregando temas…</div>
  <div class="grid" id="grid"></div>
</main>

<footer>Tessela — estilos para QGIS.</footer>

<div class="overlay" id="overlay">
  <div class="detail">
    <button class="close" id="closeBtn">✕</button>
    <div class="detail-image" id="detailImageWrap">
      <img id="detailImage" alt="" draggable="false">
    </div>
    <p style="padding:8px 32px 0;font-size:12px;color:var(--ink-soft);">Role para dar zoom · arraste para mover · duplo clique para centralizar</p>
    <div class="detail-body">
      <div class="cat" id="detailCat"></div>
      <h2 id="detailName"></h2>
      <div class="meta-row">
        <span class="price" id="detailPrice"></span>
        <span class="date" id="detailDate"></span>
      </div>
      <div class="layers-summary" id="layersSummary"></div>
      <div id="layersList"></div>
      <button class="buy-btn" id="buyBtn"></button>
      <div class="buy-status" id="buyStatus"></div>
    </div>
  </div>
</div>

<script>
const OWNER = 'pedromoreli95';
const REPO = 'tessela-publico';
const CATEGORIES = ['Infraestrutura', 'Ambiental', 'Socioespacial', 'Socioeconômico'];
const rawUrl = path => `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${path}`;

let themes = [];
let current = null;
let activeCategory = null;

function renderFilters(){
  const wrap = document.getElementById('filters');
  wrap.innerHTML = '';
  ['Todos', ...CATEGORIES].forEach(label=>{
    const chip = document.createElement('button');
    chip.className = 'chip' + ((label==='Todos' && !activeCategory) || label===activeCategory ? ' active' : '');
    chip.textContent = label;
    chip.addEventListener('click', ()=>{
      activeCategory = label === 'Todos' ? null : label;
      renderFilters();
      applyFilters();
    });
    wrap.appendChild(chip);
  });
}

function applyFilters(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = themes.filter(t=>{
    const matchesText = !q || (t.name||'').toLowerCase().includes(q) || (t.category||'').toLowerCase().includes(q);
    const matchesCategory = !activeCategory || t.category === activeCategory;
    return matchesText && matchesCategory;
  });
  renderGrid(filtered);
}

async function loadThemes(){
  const statusEl = document.getElementById('status');
  try{
    const res = await fetch(rawUrl('themes/index.json') + `?t=${Date.now()}`, {cache:'no-store'});
    if(!res.ok) throw new Error('não encontrado');
    themes = await res.json();
  }catch(err){
    statusEl.textContent = 'Não foi possível carregar os temas agora.';
    return;
  }
  statusEl.textContent = themes.length ? `${themes.length} tema(s) disponível(is).` : 'Nenhum tema publicado ainda.';
  renderFilters();
  renderGrid(themes);
}

function renderGrid(list){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if(!list.length){
    grid.innerHTML = '<div class="empty">Nenhum tema encontrado.</div>';
    return;
  }
  list.forEach(theme=>{
    const card = document.createElement('div');
    card.className = 'card';
    const priceLabel = theme.free ? 'Grátis' : (theme.price || '');
    card.innerHTML = `
      <div class="thumb">${theme.thumb_url ? `<img src="${theme.thumb_url}" loading="lazy" alt="">` : ''}</div>
      <div class="info">
        <div class="cat">${theme.category || ''}</div>
        <h3>${theme.name}</h3>
        <div class="price${theme.free ? ' free' : ''}">${priceLabel}</div>
      </div>`;
    card.addEventListener('click', ()=>openDetail(theme));
    grid.appendChild(card);
  });
}

document.getElementById('search').addEventListener('input', applyFilters);

function formatDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  if(!y||!m||!d) return '';
  return `Publicado em ${d}/${m}/${y}`;
}

function openDetail(theme){
  current = theme;
  document.getElementById('detailCat').textContent = (theme.category||'').toUpperCase();
  document.getElementById('detailName').textContent = theme.name;
  const priceEl = document.getElementById('detailPrice');
  priceEl.textContent = theme.free ? 'Grátis' : (theme.price || '');
  priceEl.className = 'price' + (theme.free ? ' free' : '');
  document.getElementById('detailDate').textContent = formatDate(theme.created_at);

  const img = document.getElementById('detailImage');
  img.src = theme.thumb_url || '';
  resetZoom();

  const layersInfo = theme.layers_info || [];
  document.getElementById('layersSummary').textContent =
    layersInfo.length ? `${layersInfo.length} estilo${layersInfo.length!==1?'s':''} neste tema:` : '';

  const listEl = document.getElementById('layersList');
  listEl.innerHTML = '';
  layersInfo.forEach(info=>{
    const row = document.createElement('div');
    row.className = 'layer-row';
    const count = info.category_count || 0;
    const plural = count === 1 ? 'categoria' : 'categorias';
    const icons = `
      ${info.has_symbology ? '<span class="icon-sym" title="Simbologia configurada"></span>' : ''}
      ${info.has_labels ? `<span class="icon-lbl" title="Rótulos configurados"><svg viewBox="0 0 8 8"><path d="M1.5 2h5M4 2v4.5" stroke="white" stroke-width="1.1" stroke-linecap="round"/></svg></span>` : ''}
    `;
    const bars = (info.colors||[]).map(c=>`<span style="background:${c}"></span>`).join('');
    row.innerHTML = `
      <div class="name">${info.name}${count?` — ${count} ${plural}`:''}${icons}</div>
      ${bars ? `<div class="colorbar">${bars}</div>` : ''}`;
    listEl.appendChild(row);
  });

  const buyBtn = document.getElementById('buyBtn');
  document.getElementById('buyStatus').textContent = '';
  if(theme.free){
    buyBtn.textContent = 'Baixar grátis';
    buyBtn.disabled = !(theme.free_files && theme.free_files.length);
    buyBtn.onclick = ()=>downloadFree(theme);
  }else{
    buyBtn.textContent = 'Comprar';
    buyBtn.disabled = !theme.buy_url;
    buyBtn.onclick = ()=>window.open(theme.buy_url, '_blank');
  }

  document.getElementById('overlay').classList.add('show');
}

/* ---------- pan/zoom da imagem de prévia ---------- */
const imgWrap = document.getElementById('detailImageWrap');
const imgEl = document.getElementById('detailImage');
let zoomState = {scale: 1, x: 0, y: 0};
let dragging = false, dragStart = {x: 0, y: 0}, panStart = {x: 0, y: 0};

function applyTransform(){
  imgEl.style.transform = `translate(${zoomState.x}px, ${zoomState.y}px) scale(${zoomState.scale})`;
}
function clampPan(){
  const rect = imgWrap.getBoundingClientRect();
  const minX = rect.width * (1 - zoomState.scale), maxX = 0;
  const minY = rect.height * (1 - zoomState.scale), maxY = 0;
  zoomState.x = Math.min(maxX, Math.max(minX, zoomState.x));
  zoomState.y = Math.min(maxY, Math.max(minY, zoomState.y));
}
function resetZoom(){
  zoomState = {scale: 1, x: 0, y: 0};
  applyTransform();
}

imgWrap.addEventListener('wheel', e=>{
  e.preventDefault();
  const rect = imgWrap.getBoundingClientRect();
  const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
  const newScale = Math.min(6, Math.max(1, zoomState.scale * factor));
  zoomState.x = mouseX - (mouseX - zoomState.x) * (newScale / zoomState.scale);
  zoomState.y = mouseY - (mouseY - zoomState.y) * (newScale / zoomState.scale);
  zoomState.scale = newScale;
  clampPan();
  applyTransform();
}, {passive: false});

imgWrap.addEventListener('pointerdown', e=>{
  dragging = true;
  imgWrap.classList.add('dragging');
  imgWrap.setPointerCapture(e.pointerId);
  dragStart = {x: e.clientX, y: e.clientY};
  panStart = {x: zoomState.x, y: zoomState.y};
});
imgWrap.addEventListener('pointermove', e=>{
  if(!dragging) return;
  zoomState.x = panStart.x + (e.clientX - dragStart.x);
  zoomState.y = panStart.y + (e.clientY - dragStart.y);
  clampPan();
  applyTransform();
});
imgWrap.addEventListener('pointerup', ()=>{ dragging = false; imgWrap.classList.remove('dragging'); });
imgWrap.addEventListener('pointercancel', ()=>{ dragging = false; imgWrap.classList.remove('dragging'); });
imgWrap.addEventListener('dblclick', resetZoom);

document.getElementById('closeBtn').addEventListener('click', closeDetail);
document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target.id === 'overlay') closeDetail();
});
function closeDetail(){
  document.getElementById('overlay').classList.remove('show');
  current = null;
}

/* ---------- baixar temas gratuitos ---------- */
async function downloadFree(theme){
  const statusEl = document.getElementById('buyStatus');
  const files = theme.free_files || [];
  if(!files.length) return;
  statusEl.textContent = 'Baixando…';
  try{
    const results = [];
    for(const f of files){
      const res = await fetch(f.qml_url);
      if(!res.ok) continue;
      results.push({name: f.name, data: await res.arrayBuffer()});
    }
    if(!results.length){ statusEl.textContent = 'Não consegui baixar os arquivos.'; return; }

    if(results.length === 1){
      triggerDownload(safeName(results[0].name)+'.qml', new Blob([results[0].data], {type:'application/xml'}));
    }else{
      const zipFiles = results.map(r=>({name: safeName(r.name)+'.qml', content: new Uint8Array(r.data)}));
      const blob = buildZip(zipFiles);
      triggerDownload(safeName(theme.name)+'.zip', blob);
    }
    statusEl.textContent = 'Download concluído.';
  }catch(err){
    statusEl.textContent = 'Não consegui baixar os arquivos.';
  }
}
function safeName(s){ return (s||'estilo').replace(/[^\w\- ]/g,'').trim() || 'estilo'; }
function triggerDownload(filename, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* ---------- zip simples (sem compressão, sem dependências) ---------- */
function crc32(buf){
  let table = crc32.table;
  if(!table){
    table = crc32.table = new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); table[n]=c>>>0; }
  }
  let crc = 0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) crc = table[(crc ^ buf[i]) & 0xFF] ^ (crc>>>8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function buildZip(files){
  const enc = new TextEncoder();
  const localParts=[], centralParts=[]; let offset=0;
  files.forEach(f=>{
    const nameBytes = enc.encode(f.name);
    const dataBytes = f.content instanceof Uint8Array ? f.content : enc.encode(f.content);
    const crc = crc32(dataBytes), size = dataBytes.length;
    const lh = new Uint8Array(30+nameBytes.length); const lv = new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0,true); lv.setUint16(8,0,true);
    lv.setUint16(10,0,true); lv.setUint16(12,0x21,true); lv.setUint32(14,crc,true);
    lv.setUint32(18,size,true); lv.setUint32(22,size,true); lv.setUint16(26,nameBytes.length,true); lv.setUint16(28,0,true);
    lh.set(nameBytes,30);
    localParts.push(lh,dataBytes);

    const ch = new Uint8Array(46+nameBytes.length); const cv = new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true); cv.setUint16(8,0,true);
    cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0x21,true); cv.setUint32(16,crc,true);
    cv.setUint32(20,size,true); cv.setUint32(24,size,true); cv.setUint16(28,nameBytes.length,true);
    cv.setUint16(30,0,true); cv.setUint16(32,0,true); cv.setUint16(34,0,true); cv.setUint16(36,0,true);
    cv.setUint32(38,0,true); cv.setUint32(42,offset,true);
    ch.set(nameBytes,46);
    centralParts.push(ch);
    offset += lh.length + dataBytes.length;
  });
  const centralStart = offset; let centralSize=0; centralParts.forEach(p=>centralSize+=p.length);
  const end = new Uint8Array(22); const ev = new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,centralSize,true); ev.setUint32(16,centralStart,true);
  return new Blob([...localParts, ...centralParts, end], {type:'application/zip'});
}

loadThemes();
</script>
</body>
</html>
